<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso | Sistema Financiero</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="login">

        <div class="tarjeta-login">

            <h1>Acceso al sistema</h1>

            <p>Ingrese sus credenciales para continuar</p>

            <form id="loginForm">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.cl"
                    required
                >

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >

                <button type="submit" class="boton">
                    Ingresar
                </button>

            </form>

        </div>

    </main>

</body>
</html>
